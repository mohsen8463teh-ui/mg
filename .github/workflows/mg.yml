          def _months(y0, m0, k):
              t = y0 * 12 + (m0 - 1) + k
              return t // 12, t % 12 + 1

          def windows():
              out, k = [], 0
              while True:
                  y0, m0 = _months(2019, 1, k);            y1, m1 = _months(2019, 1, k + 18)
                  y2, m2 = _months(2019, 1, k + 18)
                  ts = f"{y1}-{m1:02d}-01"; te = f"{y2}-{m2:02d}-01"
                  if y2 > 2023 or (y2 == 2023 and m2 > 12):
                      te = "2024-01-01"
                      out.append(dict(train_start=f"{y0}-{m0:02d}-01", train_end=ts,
                                      test_start=ts, test_end=te)); break
                  out.append(dict(train_start=f"{y0}-{m0:02d}-01", train_end=ts,
                                  test_start=ts, test_end=te))
                  k += 3
              return out

          def _slice(trades, a, b):
              a = int(pd.Timestamp(a).value)
              b = int(pd.Timestamp(b).value)
