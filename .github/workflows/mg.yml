          """Event-driven backtester. Only clock = close of 15m candles.
          SL and TP both touched in one candle -> SL first (conservative).
          Open gaps past SL/TP -> fill at open. Entry always next candle open.
          v1.0.3-IMPL: all candle-time comparisons done in int64 nanoseconds
          (previous version mixed np.datetime64 with int64 -> TypeError)."""
          import numpy as np
          from engine import StrategyEngine
          from portfolio import Portfolio
          from config import SYMBOLS, MAX_OPEN_POSITIONS

          def run_backtest(data15, data4, params, cost, risk_pct=0.01,
                           warm_from=None, trading_from=None, end=None):
              engs = {s: StrategyEngine(s, data15[s], data4[s], params) for s in data15}
              pf = Portfolio(cost, risk_pct, params["version"])
              ptr = {s: 0 for s in engs}
              pend_e, pend_x = {}, set()
              times = np.unique(np.concatenate([e.t for e in engs.values()]))
              if warm_from is not None:
                  wf_int = int(np.datetime64(warm_from, "ns").astype(np.int64))
                  times = times[times >= wf_int]
              if end is not None:
                  end_int = int(np.datetime64(end, "ns").astype(np.int64))
                  times = times[times <= end_int]
              tf_ns = None if trading_from is None else \
                  int(np.datetime64(trading_from, "ns").astype(np.int64))
              curve_t, curve_v = [], []
              order = [s for s in SYMBOLS if s in engs]

              for tn in times:
                  tn_ns = int(tn)
                  live = (tf_ns is None) or (tn_ns >= tf_ns)

                  def has(s):
                      e = engs[s]; p = ptr[s]
                      return p < e.n and e.t[p] == tn_ns

                  for s in [x for x in order if x in pend_x]:
                      if has(s):
                          e = engs[s]
                          pf.close(s, tn_ns, e.o[ptr[s]], "STRUCT_EXIT", False, e, params)
                          pend_x.discard(s)
                  for s in order:
                      if s in pend_e and has(s) and live:
                          e = engs[s]; raw = e.o[ptr[s]]
                          ok, reason = e.validate_fill(raw)
                          cap = len(pf.positions) < MAX_OPEN_POSITIONS and s not in pf.positions
                          if ok and cap:
                              pf.open_from_engine(s, tn_ns, raw, e, params)
                          else:
                              e.reject(tn_ns + 900_000_000, reason if not ok else "capacity")
                          pend_e.pop(s, None)
                  for s in order:
                      e = engs[s]; p_ = ptr[s]
                      while p_ < e.n and e.t[p_] < tn_ns: p_ += 1
                      ptr[s] = p_
                      if p_ < e.n and e.t[p_] == tn_ns:
                          e.feed(p_, live=live)
                          e.last_close = e.c[p_]
                          if live and e.pending is not None:
                              pend_e[s] = True
                  if live:
                      for s in list(pf.positions):
                          if not has(s): continue
                          e = engs[s]; i = ptr[s]; pos = pf.positions[s]
                          if e.l[i] <= pos["sl"]:
                              pf.close(s, tn_ns, min(e.o[i], pos["sl"]), "SL", True, e, params)
                          elif e.h[i] >= pos["tp"]:
                              pf.close(s, tn_ns, max(e.o[i], pos["tp"]), "TP", False, e, params)
                          elif params["structure_exit"] and e.c[i] < pos["pl15"]:
                              pend_x.add(s)
                      marks = {s: engs[s].last_close for s in pf.positions}
                      curve_t.append(tn_ns); curve_v.append(pf.mark(marks))
              audits = {s: e.audit for s, e in engs.items()}
              return dict(trades=pf.trades, curve_t=curve_t, curve_v=curve_v,
                          audits=audits, fees=pf.fees_total, slippage=pf.slip_total)
