          """Performance metrics + regime tagging. Computed only from real run outputs."""
          import numpy as np, pandas as pd
          from indicators import ema, wilder_atr
          from config import INITIAL_EQUITY

          def _empty():
              return dict(Total_Trades=0, Net_Profit=0.0, Net_Return_pct=0.0, Profit_Factor=0.0,
                          Win_Rate_pct=0.0, Avg_Win=0.0, Avg_Loss=0.0, Expectancy_USD=0.0,
                          Expectancy_R=0.0, Max_Drawdown_pct=0.0, Sharpe=0.0, Sortino=0.0,
                          Max_Consec_Wins=0, Max_Consec_Losses=0, Exposure_pct=0.0,
                          Trades_per_Month=0.0, Fees_Paid=0.0, Slippage_Cost=0.0)

          def compute(trades, curve_t=None, curve_v=None, initial=INITIAL_EQUITY):
              out = _empty(); n = len(trades)
              out["Total_Trades"] = n
              if n == 0: return out
              pnl = np.array([t["pnl"] for t in trades])
              r = np.array([t["r_multiple"] for t in trades])
              wins, losses = pnl[pnl > 0], pnl[pnl <= 0]
              gw, gl = wins.sum(), abs(losses.sum())
              out.update(Net_Profit=float(pnl.sum()), Net_Return_pct=100 * float(pnl.sum()) / initial,
                         Profit_Factor=float(gw / gl) if gl > 0 else float("inf"),
                         Win_Rate_pct=100 * len(wins) / n,
                         Avg_Win=float(wins.mean()) if len(wins) else 0.0,
                         Avg_Loss=float(losses.mean()) if len(losses) else 0.0,
                         Expectancy_USD=float(pnl.mean()), Expectancy_R=float(r.mean()),
                         Fees_Paid=float(sum(t["fees"] for t in trades)),
                         Slippage_Cost=float(sum(t["slippage"] for t in trades)))
              if curve_t and len(curve_t) > 1:
                  eq = pd.Series(curve_v, index=pd.to_datetime(curve_t))
                  peak = eq.cummax()
                  out["Max_Drawdown_pct"] = float(100 * ((peak - eq) / peak).max())
                  daily = eq.resample("1D").last().dropna()
                  ret = daily.pct_change().dropna()
                  sd = ret.std()
                  out["Sharpe"] = float(ret.mean() / sd * np.sqrt(365)) if sd > 0 else 0.0
                  dn = ret[ret < 0]; dsd = dn.std()
                  out["Sortino"] = float(ret.mean() / dsd * np.sqrt(365)) if dsd and dsd > 0 else 0.0
                  span_days = (eq.index[-1] - eq.index[0]).days or 1
              else:
                  span_days = max((trades[-1]["exit_ns"] - trades[0]["entry_ns"])
                                  / 86_400_000_000_000, 1)
              mw = ml = cw = cl = 0
              for x in pnl:
                  if x > 0: cw += 1; cl = 0; mw = max(mw, cw)
                  else:     cl += 1; cw = 0; ml = max(ml, cl)
              out["Max_Consec_Wins"], out["Max_Consec_Losses"] = mw, ml
              inpos = sum(t["exit_ns"] - t["entry_ns"] for t in trades)
              total = span_days * 86_400 * 1_000_000_000
              out["Exposure_pct"] = 100 * inpos / total
              out["Trades_per_Month"] = n / (span_days / 30.44)
              return out

          def per_symbol(trades):
              res = {}
              for s in sorted({t["symbol"] for t in trades}):
                  tt = [t for t in trades if t["symbol"] == s]
                  m = compute(tt)
                  pnl = np.cumsum([t["pnl"] for t in tt])
                  eq = INITIAL_EQUITY + pnl
                  peak = np.maximum.accumulate(np.maximum(eq, INITIAL_EQUITY))
                  m["Max_Drawdown_pct"] = float(100 * ((peak - eq) / peak).max()) if len(eq) else 0.0
                  res[s] = m
              return res

          def build_regimes(data4, data15):
              tab, vols = {}, []
              for s in data4:
                  df4 = data4[s]; ef = ema(df4["close"], 200); slope = ef - ef.shift(180)
                  bull = (df4["close"] > ef) & (slope > 0); bear = (df4["close"] < ef) & (slope < 0)
                  per = df4.index.to_period("M")
                  last_idx = {}
                  for i in range(len(df4)): last_idx[per[i]] = i
                  a = wilder_atr(data15[s], 14) / data15[s]["close"]
                  av = a.groupby(data15[s].index.to_period("M")).mean()
                  for m, i in last_idx.items():
                      reg = "Bull" if bull.iloc[i] else ("Bear" if bear.iloc[i] else "Range")
                      v = float(av.get(m, np.nan))
                      tab[(s, str(m))] = (reg, v)
                      if np.isfinite(v): vols.append(v)
              q1, q2 = np.quantile(vols, [1/3, 2/3])
              out = {}
              for k, (reg, v) in tab.items():
                  vol = "Low" if v < q1 else ("Medium" if v < q2 else "High")
                  out[k] = (reg, vol)
              return out, (q1, q2)

          def tag_trades(trades, regtab):
              for t in trades:
                  m = str(pd.Timestamp(t["entry_ns"]).to_period("M"))
                  reg, vol = regtab.get((t["symbol"], m), ("Unknown", "Unknown"))
                  t["regime"] = reg; t["vol_regime"] = vol
              return trades

          def per_regime(trades):
              res = {}
              for key in sorted({(t["regime"], t["vol_regime"]) for t in trades}):
                  tt = [t for t in trades if (t["regime"], t["vol_regime"]) == key]
                  res[f"{key[0]}/{key[1]}"] = compute(tt)
              return res
