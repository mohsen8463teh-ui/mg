          """Monte Carlo on REAL OOS trades only. IID + block bootstrap (block=5)."""
          import numpy as np

          def simulate(r, risk_pct, n_paths=10_000, block=5, seed=7):
              r = np.asarray([x for x in r if np.isfinite(x)], float)
              N = len(r)
              if N == 0:
                  return dict(n_trades=0)
              rng = np.random.default_rng(seed)
              def stats(paths_r):
                  eq = np.cumprod(1 + risk_pct * paths_r, axis=1)
                  peak = np.maximum.accumulate(np.concatenate(
                      [np.ones((eq.shape[0], 1)), eq], axis=1), axis=1)[:, 1:]
                  dd = (peak - eq) / peak
                  mdd = dd.max(axis=1); final = eq[:, -1]
                  return dict(n_trades=N, n_paths=n_paths,
                              ret_p5=float(np.percentile(final, 5) - 1),
                              ret_p50=float(np.percentile(final, 50) - 1),
                              ret_p95=float(np.percentile(final, 95) - 1),
                              maxdd_p50=float(np.percentile(mdd, 50)),
                              maxdd_p95=float(np.percentile(mdd, 95)),
                              maxdd_p99=float(np.percentile(mdd, 99)),
                              p_maxdd_gt_20=float((mdd > 0.20).mean()),
                              p_maxdd_gt_30=float((mdd > 0.30).mean()),
                              p_return_lt_0=float((final < 1).mean()))
              iid = rng.choice(r, size=(n_paths, N))
              out = dict(iid=stats(iid))
              nblocks = int(np.ceil(N / block))
              starts = rng.integers(0, N, size=(n_paths, nblocks))
              idx = (starts[:, :, None] + np.arange(block)[None, None, :]) % N
              blk = r[idx.reshape(n_paths, -1)[:, :N]]
              out["block"] = stats(blk)
              return out
