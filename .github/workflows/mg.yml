name: MG-Full-Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap project source (self-contained, v1.0.3-IMPL)
        run: |
          mkdir -p tests outputs
          cat > requirements.txt <<'EOF'
          pandas>=2.0
          numpy>=1.24
          requests>=2.31
          EOF
          cat > config.py <<'EOF'
          """MG Project - global configuration. Baseline logic: MG-RULEBOOK v1.0-BASELINE.
          v1.0.3-IMPL: implementation-only fixes: (a) int64-nanosecond time comparisons
          in the backtest loop, (b) exact positional mapping of 4H candles via
          searchsorted instead of epoch-division. NO strategy logic changed.
          2018 = burn-in year for EMA200_4H; no trading before 2019-01-01."""
          SYMBOLS = ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT", "ADAUSDT"]

          DATA_START = "2018-01-01"
          TRAIN = ("2019-01-01", "2022-12-31")
          VALID = ("2023-01-01", "2023-12-31")
          OOS = ("2024-01-01", None)

          INITIAL_EQUITY = 10_000.0
          RISK_PCT = 0.01
          RISK_PCT_CONSERVATIVE = 0.005
          MAX_OPEN_POSITIONS = 3
          MAX_NOTIONAL_FRAC = 0.95

          NS = 1_000_000_000
          TF15 = 900 * NS
          TF4H = 14_400 * NS
          DAY = 86_400 * NS

          BASE_PARAMS = dict(
              version="V1.0-BASELINE",
              pivot_lr=3, pivot_htf_lr=2,
              atr_period=14, ema_fast=50, ema_slow=200,
              zone_up=0.382, zone_low=0.618,
              n_pb=40, n_conf=10,
              sl_buf=0.5, tp_r=2.0,
              sl_min_dist_pct=0.002, sl_max_dist_pct=0.03,
              sweep_min_pen_pct=0.0005, sweep_min_pen_atr=0.05,
              sweep_max_pen_pct=0.006, sweep_closeback=2,
              eq_tol_pct=0.0015, eq_tol_atr=0.25,
              trend_variant=1,
              structure_exit=True,
          )

          COST_SCENARIOS = {
              "optimistic":   dict(fee=0.0005, slip=0.0002, stop_slip=0.0010),
              "realistic":    dict(fee=0.0010, slip=0.0005, stop_slip=0.0020),
              "conservative": dict(fee=0.0015, slip=0.0010, stop_slip=0.0050),
          }

          GATES = dict(
              oos_min_pf=1.15, oos_min_exp_r=0.05, oos_max_dd_pct=25.0,
              wf_min_profitable=0.55, wf_min_cum_pf=1.05, wf_worst_window_min=-10.0,
              sens_min_neighbor_profitable=0.60,
              mc_p_maxdd30_max=0.05, mc_p_neg_max=0.20,
              g7_min_symbols_pf_ge1=4, g7_min_symbol_pf=0.8,
              stress_multiples=[1.0, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0],
          )
          EOF
          cat > data.py <<'EOF'
          """Data source: Binance OFFICIAL public data dump (data.binance.vision).
          Same real Binance klines as monthly zip archives. No API key. Accessible
          from CI runners. Handles ms/us timestamps. Last (incomplete) month excluded."""
          import io, json, time, zipfile
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import requests
          from config import SYMBOLS, DATA_START

          BASE = "https://data.binance.vision/data/spot/monthly/klines"
          STEP = {"15m": 900_000, "4h": 14_400_000}

          def _months(start_ym, end_ym):
              y, m = int(start_ym[:4]), int(start_ym[5:7])
              ey, em = int(end_ym[:4]), int(end_ym[5:7])
              out = []
              while (y, m) <= (ey, em):
                  out.append((y, m))
                  m += 1
                  if m == 13: m, y = 1, y + 1
              return out

          def fetch(symbol, interval, start_ym, end_ym):
              frames, started = [], False
              for (y, m) in _months(start_ym, end_ym):
                  url = f"{BASE}/{symbol}/{interval}/{symbol}-{interval}-{y:04d}-{m:02d}.zip"
                  try:
                      r = requests.get(url, timeout=60)
                      if r.status_code >= 500:
                          time.sleep(3)
                          r = requests.get(url, timeout=60)
                  except Exception:
                      time.sleep(3)
                      r = requests.get(url, timeout=60)
                  if r.status_code == 404:
                      if started: break
                      continue
                  r.raise_for_status()
                  z = zipfile.ZipFile(io.BytesIO(r.content))
                  name = z.namelist()[0]
                  d = pd.read_csv(z.open(name), header=None)
                  if d.shape[1] > 6:
                      d = d.iloc[:, :6]
                  d.columns = ["open_time","open","high","low","close","volume"]
                  d = d[pd.to_numeric(d["open_time"], errors="coerce").notna()]
                  frames.append(d)
                  started = True
                  time.sleep(0.05)
              if not frames:
                  raise RuntimeError(f"no data found for {symbol} {interval}")
              df = pd.concat(frames, ignore_index=True)
              for c in ["open","high","low","close","volume"]:
                  df[c] = pd.to_numeric(df[c], errors="coerce")
              ts = pd.to_numeric(df["open_time"], errors="coerce").astype(np.float64)
              ts = np.where(ts > 10**14, ts / 1000.0, ts).astype(np.int64)
              df["_ms"] = ts
              df.index = pd.to_datetime(ts, unit="ms")
              df = df[~df.index.duplicated(keep="first")].sort_index()
              out = df[["open","high","low","close","volume"]].copy()
              out["close_time"] = df["_ms"] + STEP[interval] - 1
              return out

          def audit(df, interval):
              step = STEP[interval]
              ts = df.index.values.astype("datetime64[ns]").astype(np.int64) // 1_000_000
              rep = {"first": str(df.index[0]), "last": str(df.index[-1]),
                     "actual_candles": int(len(df)),
                     "expected_if_contiguous": int((ts[-1] - ts[0]) // step + 1)}
              rep["missing_candles"] = rep["expected_if_contiguous"] - rep["actual_candles"]
              d = np.diff(ts); mask = d != step
              rep["gap_count"] = int(mask.sum())
              rep["gaps"] = [{"from": str(df.index[i]), "to": str(df.index[i+1]),
                              "missing": int(d[i] // step - 1)} for i in np.where(mask)[0]][:200]
              rep["duplicate_timestamps"] = int(df.index.duplicated().sum())
              rep["out_of_order"] = int((d <= 0).sum())
              bad = ((df["high"] < df["low"]) | (df["close"] > df["high"]) | (df["close"] < df["low"]) |
                     (df["open"] > df["high"]) | (df["open"] < df["low"]) |
                     (df[["open","high","low","close"]] <= 0).any(axis=1))
              rep["invalid_ohlc"] = int(bad.sum())
              rep["zero_volume_candles"] = int((df["volume"] == 0).sum())
              rep["real_listing_start"] = str(df.index[0])
              return rep

          def download_all(raw_dir="data", symbols=None):
              symbols = symbols or SYMBOLS
              raw = Path(raw_dir); raw.mkdir(parents=True, exist_ok=True)
              now = pd.Timestamp.utcnow()
              lf = now.replace(day=1) - pd.Timedelta(days=1)
              end_ym = f"{lf.year:04d}-{lf.month:02d}"
              quality = {}
              for s in symbols:
                  for itv in ["15m", "4h"]:
                      df = fetch(s, itv, DATA_START[:7], end_ym)
                      df.to_csv(raw / f"{s}_{itv}.csv")
                      quality[f"{s}_{itv}"] = audit(df, itv)
                      print(f"[data] {s} {itv}: {len(df)} candles "
                            f"({df.index[0]} .. {df.index[-1]}), missing="
                            f"{quality[f'{s}_{itv}']['missing_candles']}")
              (raw / "data_quality_report.json").write_text(json.dumps(quality, indent=2))
              return quality

          def load(raw_dir="data", symbols=None):
              symbols = symbols or SYMBOLS
              d15, d4 = {}, {}
              for s in symbols:
                  a = pd.read_csv(Path(raw_dir)/f"{s}_15m.csv", index_col=0, parse_dates=True)
                  b = pd.read_csv(Path(raw_dir)/f"{s}_4h.csv",  index_col=0, parse_dates=True)
                  d15[s], d4[s] = a, b
              return d15, d4
          EOF
          cat > indicators.py <<'EOF'
          """Causal indicators + strict pivots. Pivot usable only after R right candles closed."""
          import numpy as np, pandas as pd

          def ema(s, n):
              return s.ewm(span=n, adjust=False).mean()

          def wilder_atr(df, n=14):
              h, l, c = df["high"], df["low"], df["close"]
              pc = c.shift(1)
              tr = pd.concat([h - l, (h - pc).abs(), (l - pc).abs()], axis=1).max(axis=1)
              return tr.ewm(alpha=1.0 / n, adjust=False).mean()

          def pivot_events(high, low, L, R):
              h, l = high.to_numpy(float), low.to_numpy(float)
              n = len(h); ev = []
              for i in range(L, n - R):
                  x = h[i]; ok = True
                  for j in range(1, L + 1):
                      if h[i - j] >= x: ok = False; break
                  if ok:
                      for j in range(1, R + 1):
                          if h[i + j] >= x: ok = False; break
                  if ok: ev.append((i + R, i, float(x), "PH"))
                  x = l[i]; ok = True
                  for j in range(1, L + 1):
                      if l[i - j] <= x: ok = False; break
                  if ok:
                      for j in range(1, R + 1):
                          if l[i + j] <= x: ok = False; break
                  if ok: ev.append((i + R, i, float(x), "PL"))
              ev.sort(key=lambda e: (e[0], e[1]))
              return ev
          EOF
          cat > engine.py <<'EOF'
          """MG Strategy Engine - v1.0-BASELINE logic. Event-driven, zero lookahead.
          Fed ONLY closed 15m candles in order. Pivots time-gated: usable only after
          their R right-hand candles have closed. Architecture forbids future access.
          v1.0.3-IMPL: 4H candle index computed exactly via searchsorted on the real
          4H open-time array (previous version used epoch division -> invalid index)."""
          from bisect import insort, bisect_right
          import numpy as np
          from indicators import ema, wilder_atr, pivot_events
          from config import TF15, TF4H, DAY

          SCAN, ARMED, PB, CONF, TRD = "SCAN","ARMED","PULLBACK_WAIT","ENTRY_CONFIRM_WAIT","IN_TRADE"

          class Pool:
              __slots__ = ("level", "source", "active")
              def __init__(self, level, source):
                  self.level = float(level); self.source = source; self.active = True

          class Setup:
              def __init__(self):
                  self.ph_idx = -1; self.ph_price = 0.0; self.ph_conf_ts = 0
                  self.pl_idx = -1; self.pl_price = 0.0
                  self.bos_idx = -1; self.h_leg = 0.0; self.rng = 0.0
                  self.zone_up = 0.0; self.zone_low = 0.0
                  self.zone_touched = False; self.touch_ts = 0
                  self.pools = []; self.slevels = []
                  self.sweep = None; self.sweep_pend = None
                  self.deadline = -1

          class StrategyEngine:
              def __init__(self, symbol, df15, df4, p):
                  self.symbol = symbol; self.p = p
                  self.t = df15.index.values.astype("datetime64[ns]").astype(np.int64)
                  self.o = df15["open"].to_numpy(float);  self.h = df15["high"].to_numpy(float)
                  self.l = df15["low"].to_numpy(float);   self.c = df15["close"].to_numpy(float)
                  self.n = len(self.t)
                  self.c4 = df4["close"].to_numpy(float)
                  ef = ema(df4["close"], p["ema_fast"]); es = ema(df4["close"], p["ema_slow"])
                  self.ef4 = ef.to_numpy(float); self.es4 = es.to_numpy(float)
                  self.slope4 = (ef - ef.shift(180)).to_numpy(float)
                  self.atr = wilder_atr(df15, p["atr_period"]).to_numpy(float)
                  L = p["pivot_lr"]
                  pv15 = pivot_events(df15["high"], df15["low"], L, L)
                  self.pv15 = [(self.t[ci] + TF15, pi, pr, k) for (ci, pi, pr, k) in pv15]
                  L4 = p["pivot_htf_lr"]
                  pv4 = pivot_events(df4["high"], df4["low"], L4, L4)
                  t4c = df4.index.values.astype("datetime64[ns]").astype(np.int64)
                  self.t4c = t4c
                  self.pv4 = [(t4c[ci] + TF4H, pi, pr, k) for (ci, pi, pr, k) in pv4]
                  self.state = SCAN; self.i15 = 0; self.i4 = 0; self._seq = 0
                  self.trend_ok = False; self.struct_bull = False; self._last4 = None
                  self.ph4 = []; self.pl4 = []
                  self.ph15 = None; self.pl15 = None; self.pl_list = []
                  self.pools = []; self.slevels = []
                  self.pdl = None; self.pdl_day = -1; self.day_low = np.inf
                  self.setup = None; self.pending = None
                  self.block_until = -1
                  self.last_close = np.nan
                  self.audit = []

              def log(self, idx, ev, **info):
                  self.audit.append(dict(ts=str(self.t[idx]), symbol=self.symbol,
                                         state=self.state, event=ev, **info))

              def _register(self, pool):
                  self._seq += 1
                  insort(self.slevels, (pool.level, self._seq, pool))
                  self.pools.append(pool)

              def _add_pool(self, idx, level, source):
                  tol = max(self.p["eq_tol_pct"] * level, self.p["eq_tol_atr"] * self.atr[idx])
                  for _, q in self.slevels:
                      if q.active and abs(q.level - level) <= tol:
                          return
                  self._register(Pool(level, source))

              def _add_pl_pools(self, idx, price):
                  self._add_pool(idx, price, "PL")
                  tol = max(self.p["eq_tol_pct"] * price, self.p["eq_tol_atr"] * self.atr[idx])
                  for pi2, pr2 in reversed(self.pl_list[:-1]):
                      if abs(pr2 - price) <= tol:
                          self._add_pool(idx, (pr2 + price) / 2.0, "EQ")
                          break

              def _last_pl_before(self, ph_idx):
                  for pi, pr in reversed(self.pl_list):
                      if pi < ph_idx:
                          return (pi, pr)
                  return None

              def _snapshot_pools(self, idx):
                  cap = self.c[idx] * 1.5
                  pools, sl, seq0 = [], [], self._seq
                  j = bisect_right(self.slevels, (-np.inf, 10**18, None))
                  for lv, _, q in self.slevels[j:]:
                      if lv > cap: break
                      if q.active and lv < self.c[idx]:
                          p = Pool(lv, q.source); pools.append(p)
                          seq0 += 1; sl.append((lv, seq0, p))
                  sl.sort(key=lambda x: x[0])
                  return pools, sl

              def _invalidate(self, idx, reason):
                  self.log(idx, "SETUP_INVALID", reason=reason)
                  self.state = SCAN; self.setup = None; self.pending = None
                  self.block_until = int(self.t[idx]) + TF15

              def _expire(self, idx):
                  self.log(idx, "SETUP_EXPIRED", reason="no_confirmation")
                  self.state = SCAN; self.setup = None
                  self.block_until = int(self.t[idx]) + TF15

              def _sweep_confirm(self, idx, sp):
                  su = self.setup
                  su.sweep = dict(level=sp["level"], pen=sp["pen"], sweep_ts=int(self.t[idx]),
                                  conf_ts=int(self.t[idx]), source=sp["source"])
                  su.sweep_pend = None
                  sp["pool"].active = False
                  self.log(idx, "SWEEP_CONFIRM", level=sp["level"], pen=sp["pen"])

              def _try_conf(self, idx):
                  su = self.setup
                  if su and su.zone_touched and su.sweep is not None and self.state == PB:
                      self.state = CONF; su.deadline = idx + self.p["n_conf"]
                      self.log(idx, "ENTRY_CONFIRM_WAIT", deadline=su.deadline)
                      if self.c[idx] > su.sweep["level"] and self.c[idx] > self.o[idx]:
                          self._emit_signal(idx)

              def _scan_sweeps(self, idx):
                  su = self.setup
                  lo = self.l[idx]; close = self.c[idx]
                  j = bisect_right(su.slevels, (lo, 10**18, None))
                  for lv, _, pool in su.slevels[j:]:
                      if lv > close * 1.5: break
                      if not pool.active: continue
                      pen = lv - lo
                      if pen > lv * self.p["sweep_max_pen_pct"]:
                          self._invalidate(idx, "sweep_max_pen_breach"); return
                      min_pen = max(lv * self.p["sweep_min_pen_pct"],
                                    self.p["sweep_min_pen_atr"] * self.atr[idx])
                      if pen >= min_pen:
                          if su.sweep_pend is None:
                              su.sweep_pend = dict(pool=pool, level=lv, pen=pen,
                                                   idx=idx, source=pool.source)
                              self.log(idx, "SWEEP_PENDING", level=lv, pen=pen)
                              if close > lv:
                                  self._sweep_confirm(idx, su.sweep_pend)
                                  self._try_conf(idx); return
                          break

              def _emit_signal(self, idx):
                  su = self.setup
                  setup_low = float(np.min(self.l[su.bos_idx + 1: idx + 1]))
                  sl = setup_low - self.p["sl_buf"] * self.atr[idx]
                  if not (sl < self.c[idx]):
                      self._invalidate(idx, "bad_sl"); return
                  self.pending = dict(
                      sig_idx=idx, sig_ts=int(self.t[idx]), sl=sl, setup_low=setup_low,
                      level=su.sweep["level"], pen=su.sweep["pen"], source=su.sweep["source"],
                      zone_up=su.zone_up, zone_low=su.zone_low, touch_ts=su.touch_ts,
                      sweep_ts=su.sweep["sweep_ts"], pl_price=su.pl_price,
                      ph_price=su.ph_price, h_leg=su.h_leg, bos_ts=int(self.t[su.bos_idx]),
                      checklist=dict(trend=True, struct=True, pivot=True, bos=True,
                                     pullback=True, sweep=True, confirm=True))
                  self.log(idx, "ENTRY_SIGNAL", sl=sl, level=su.sweep["level"])

              def validate_fill(self, fill_price):
                  if self.pending is None: return False, "no_signal"
                  d = (fill_price - self.pending["sl"]) / fill_price
                  if not (self.p["sl_min_dist_pct"] <= d <= self.p["sl_max_dist_pct"]):
                      return False, "sl_distance_filter"
                  if not (self.trend_ok and self.struct_bull):
                      return False, "trend_or_struct_lost_at_entry"
                  return True, "ok"

              def confirm_entry(self):
                  self.state = TRD
                  meta = self.pending; self.pending = None
                  return meta

              def reject(self, ts_close_ns, reason):
                  self.audit.append(dict(ts=str(ts_close_ns), symbol=self.symbol,
                                         state=self.state, event="ENTRY_REJECTED",
                                         reason=reason))
                  self.state = SCAN; self.setup = None; self.pending = None
                  self.block_until = ts_close_ns

              def on_position_closed(self, ts_close_ns):
                  self.state = SCAN; self.setup = None; self.pending = None
                  self.block_until = ts_close_ns

              def feed(self, idx, live=True):
                  T = int(self.t[idx]); now_close = T + TF15
                  day = T // DAY
                  if day != self.pdl_day:
                      if self.pdl_day >= 0 and np.isfinite(self.day_low):
                          if self.pdl is not None: self.pdl.active = False
                          self.pdl = Pool(self.day_low, "PDL"); self._register(self.pdl)
                      self.pdl_day = day; self.day_low = np.inf
                  self.day_low = min(self.day_low, self.l[idx])
                  on4 = (T % TF4H == 0)
                  if on4:
                      prev_open = T - TF4H
                      k = int(np.searchsorted(self.t4c, prev_open))
                      if k < len(self.c4) and self.t4c[k] == prev_open:
                          self._last4 = k
                  while self.i4 < len(self.pv4) and self.pv4[self.i4][0] <= now_close:
                      _, pi, pr, kd = self.pv4[self.i4]; self.i4 += 1
                      hist = self.ph4 if kd == "PH" else self.pl4
                      hist.append((pi, pr))
                      if len(hist) > 2: hist.pop(0)
                  if len(self.ph4) == 2 and len(self.pl4) == 2:
                      self.struct_bull = (self.ph4[1][1] > self.ph4[0][1]) and \
                                         (self.pl4[1][1] > self.pl4[0][1])
                  if on4 and self._last4 is not None:
                      k = self._last4; c4 = self.c4[k]
                      f, s = self.ef4[k], self.es4[k]
                      if self.p["trend_variant"] == 2:   self.trend_ok = c4 > s
                      elif self.p["trend_variant"] == 3: self.trend_ok = (f > s) and (c4 > f) \
                                                                          and (self.slope4[k] > 0)
                      else:                              self.trend_ok = (f > s) and (c4 > f)
                      if self.state in (ARMED, PB, CONF):
                          if not self.trend_ok:            self._invalidate(idx, "trend_lost_4h")
                          elif not self.struct_bull:       self._invalidate(idx, "structure_lost_4h")
                          elif self.pl4 and c4 < self.pl4[-1][1]:
                                                           self._invalidate(idx, "4h_close_below_PL4")
                  while self.i15 < len(self.pv15) and self.pv15[self.i15][0] <= now_close:
                      _, pi, pr, kd = self.pv15[self.i15]; self.i15 += 1
                      if kd == "PH":
                          self.ph15 = (pi, pr)
                          if (self.state == SCAN and T > self.block_until
                                  and self.trend_ok and self.struct_bull):
                              leg = self._last_pl_before(pi)
                              if leg is not None:
                                  su = Setup()
                                  su.ph_idx, su.ph_price = pi, pr
                                  su.ph_conf_ts = self.pv15[self.i15 - 1][0]
                                  su.pl_idx, su.pl_price = leg
                                  self.setup = su; self.state = ARMED
                                  self.log(idx, "ARMED", ph=pr, pl=su.pl_price)
                      else:
                          self.pl15 = (pi, pr)
                          self.pl_list.append((pi, pr))
                          if len(self.pl_list) > 60: del self.pl_list[:-60]
                          self._add_pl_pools(idx, pr)
                  if self.pending is not None:
                      return None
                  su = self.setup
                  if su is not None and self.state in (ARMED, PB, CONF):
                      if self.c[idx] < su.pl_price:
                          self._invalidate(idx, "structure_break_15m"); return None
                  if self.state == ARMED and su is not None:
                      if self.c[idx] > su.ph_price:
                          su.bos_idx = idx
                          su.h_leg = float(np.max(self.h[su.pl_idx: idx + 1]))
                          su.rng = su.h_leg - su.pl_price
                          su.zone_up  = su.h_leg - self.p["zone_up"]  * su.rng
                          su.zone_low = su.h_leg - self.p["zone_low"] * su.rng
                          su.pools, su.slevels = self._snapshot_pools(idx)
                          su.sweep = None; su.sweep_pend = None; su.zone_touched = False
                          self.state = PB
                          self.log(idx, "BOS", level=su.ph_price, h_leg=su.h_leg)
                      return None
                  if self.state == PB and su is not None:
                      if idx - su.bos_idx > self.p["n_pb"]:
                          self._invalidate(idx, "pb_timeout"); return None
                      if su.sweep_pend is not None:
                          sp = su.sweep_pend
                          if self.c[idx] > sp["level"]:
                              self._sweep_confirm(idx, sp)
                          elif idx - sp["idx"] >= self.p["sweep_closeback"]:
                              sp["pool"].active = False; su.sweep_pend = None
                              self.audit.append(dict(ts=str(self.t[idx]), symbol=self.symbol,
                                                     state=self.state, event="SWEEP_FAILED",
                                                     level=sp["level"]))
                      if self.state == PB:
                          self._scan_sweeps(idx)
                      if self.state == PB and su is not None and not su.zone_touched \
                              and self.l[idx] <= su.zone_up:
                          su.zone_touched = True; su.touch_ts = int(self.t[idx])
                          self.log(idx, "ZONE_TOUCH", zone_up=su.zone_up)
                      if live:
                          self._try_conf(idx)
                      return None
                  if self.state == CONF and su is not None:
                      if su.sweep is not None and \
                         self.c[idx] < su.sweep["level"] * (1 - self.p["sweep_max_pen_pct"]):
                          self._invalidate(idx, "sweep_level_break"); return None
                      if self.c[idx] > su.sweep["level"] and self.c[idx] > self.o[idx]:
                          if live: self._emit_signal(idx)
                          return None
                      if idx > su.deadline:
                          self._expire(idx)
                      return None
                  return None
          EOF
